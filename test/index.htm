<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUJI Calendar Generator</title>
<style>
body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    margin:40px;
    background:#f4f6fa;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
}

.row{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
}

textarea{
    width:100%;
    height:220px;
    font-family:monospace;
    font-size:15px;
    padding:12px;
    resize:vertical;
}

input{
    padding:8px;
    font-size:16px;
}

button{
    padding:12px 20px;
    font-size:16px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#log{
    margin-top:20px;
    background:#111;
    color:#0f0;
    padding:15px;
    height:250px;
    overflow:auto;
    font-family:monospace;
    white-space:pre-wrap;
    border-radius:10px;
}

.footer{
    margin-top:20px;
    color:#666;
}
.center {
  display: flex;
  justify-content: center;
  align-items: center;
}
body {
  margin: 0;
  padding: 0;
}

h2, p {
  margin: 10px;
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #38444d;
}

li {
  float: left;
}

li a, .dropbtn {
  display: inline-block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

li a:hover, .dropdown:hover .dropbtn {
  background-color: red;
}

li.dropdown {
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.dropdown-content a:hover {background-color: #f1f1f1;}

.dropdown:hover .dropdown-content {
  display: block;
}
</style>
</head>

<ul>
  <li><a href="#" data-page="all.html">Home</a></li>
  <li class="dropdown">
    <a href="javascript:void(0)" class="dropbtn">Maths</a>
    <div class="dropdown-content">
      <a href="#" data-page="maths.html">Year 1</a>
      <a href="#" data-page="maths2.html">Year 2</a>
      <a href="#" data-page="maths3.html">Year 3</a>
    </div>
  </li>
  <li class="dropdown">
    <a href="javascript:void(0)" class="dropbtn">CompSci</a>
    <div class="dropdown-content">
      <a href="#" data-page="CompSci1.html">Year 1</a>
      <a href="#" data-page="CompSci2.html">Year 2</a>
      <a href="#" data-page="CompSci3.html">Year 3</a>
      <a href="#" data-page="CompSci4.html">Year 4</a>
    </div>
  </li>
  <li class="dropdown">
    <a href="javascript:void(0)" class="dropbtn">Physics</a>
    <div class="dropdown-content">
      <a href="#" data-page="Physics1.html">Year 1</a>
      <a href="#" data-page="Physics2.html">Year 2</a>
      <a href="#" data-page="Physics3.html">Year 3</a>
    </div>
  </li>
</ul>



<iframe id="myIframe" src="all.html" style="position: absolute; height: 100%; width: 90%; border: none;" scrolling=no></iframe>



<script>
document.querySelectorAll("[data-page]").forEach(link => {
    link.addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("myIframe").src = this.dataset.page;
    });
});
</script>
