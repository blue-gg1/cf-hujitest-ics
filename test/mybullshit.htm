<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUJI Calendar Generator</title>
<style>
body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    margin:40px;
    background:#f4f6fa;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
}

.row{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
}

textarea{
    width:100%;
    height:220px;
    font-family:monospace;
    font-size:15px;
    padding:12px;
    resize:vertical;
}

input{
    padding:8px;
    font-size:16px;
}

button{
    padding:12px 20px;
    font-size:16px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#log{
    margin-top:20px;
    background:#111;
    color:#0f0;
    padding:15px;
    height:250px;
    overflow:auto;
    font-family:monospace;
    white-space:pre-wrap;
    border-radius:10px;
}

.footer{
    margin-top:20px;
    color:#666;
}
</style>
</head>
