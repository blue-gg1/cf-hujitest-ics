<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUJI Exam Calendar Generator</title>

<style>
body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    margin:40px;
    background:#f4f6fa;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
}

.row{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
}

textarea{
    width:100%;
    height:220px;
    font-family:monospace;
    font-size:15px;
    padding:12px;
    resize:vertical;
}

input{
    padding:8px;
    font-size:16px;
}

button{
    padding:12px 20px;
    font-size:16px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#log{
    margin-top:20px;
    background:#111;
    color:#0f0;
    padding:15px;
    height:250px;
    overflow:auto;
    font-family:monospace;
    white-space:pre-wrap;
    border-radius:10px;
}

.footer{
    margin-top:20px;
    color:#666;
}
</style>
</head>
<body>

<div class="container">

<h1>HUJI Exam Calendar Generator</h1>

<div class="row">
<label>
Year
<br>
<input id="year" type="number" value="2026">
</label>

<button id="generate">
Generate ICS
</button>
</div>

<label>Course Codes (one per line)</label>

<textarea id="courses">
67501
76123
</textarea>

<div id="log"></div>

<div class="footer">
Generates an iCalendar (.ics) file directly in your browser.
</div>

</div>

<script>

const logBox=document.getElementById("log");

function log(msg){
    logBox.textContent+=msg+"\n";
    logBox.scrollTop=logBox.scrollHeight;
}

function pad(n){
    return String(n).padStart(2,"0");
}

function formatICSDate(date){

    const d=new Date(date);

    return d.getUTCFullYear()+
        pad(d.getUTCMonth()+1)+
        pad(d.getUTCDate())+"T"+
        pad(d.getUTCHours())+
        pad(d.getUTCMinutes())+
        pad(d.getUTCSeconds())+"Z";
}

function escapeICS(text){
    if(!text) return "";
    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/\n/g,"\\n")
        .replace(/,/g,"\\,")
        .replace(/;/g,"\\;");
}

async function getCourse(code,year){

    const url=`https://shnaton.huji.ac.il/api/courses/code/${code}?year=${year}`;

    const r=await fetch(url);

    if(!r.ok)
        throw new Error("Course lookup failed");

    const json=await r.json();

    return {
        id:json[0].id,
        name:json[0].name.he
    };
}

async function getAssignments(courseId,year){

    const url=`https://shnaton.huji.ac.il/api/assignments?year=${year}&courseId=${courseId}`;

    const r=await fetch(url);

    if(!r.ok)
        throw new Error("Assignments failed");

    return await r.json();

}

function createEvent(event){

return `BEGIN:VEVENT
UID:${event.uid}
DTSTAMP:${formatICSDate(new Date())}
DTSTART:${formatICSDate(event.start)}
DTEND:${formatICSDate(event.end)}
SUMMARY:${escapeICS(event.summary)}
LOCATION:${escapeICS(event.location)}
DESCRIPTION:${escapeICS(event.description)}
END:VEVENT`;

}

document.getElementById("generate").onclick=async()=>{

const button=document.getElementById("generate");
button.disabled=true;
logBox.textContent="";

const year=document.getElementById("year").value.trim();

const courses=document.getElementById("courses")
.value
.split(/\n/)
.map(x=>x.trim())
.filter(Boolean);

const events=[];

for(const code of courses){

try{

log("Processing "+code);

const course=await getCourse(code,year);

const assignments=await getAssignments(course.id,year);

for(const assignment of assignments){

const en=assignment.assignmentDefinition.name.en;

if(![
"Written test",
"Mid-term Exams",
"First partial test",
"Second partial test"
].includes(en))
continue;

for(const schedule of assignment.schedules||[]){

const start=new Date(schedule.startTime);
const end=new Date(schedule.endTime);

const location=(schedule.rooms||[])
.map(r=>r.name.he)
.join(", ");

const description=
`Subject to change.
Check:
https://shnaton.huji.ac.il/course/${code}

Location: ${location}
Course: ${course.name}
Course Code: ${code}
Exam: ${assignment.assignmentDefinition.name.he}
Semester: ${schedule.periodName.he}
Moed: ${schedule.moed}

Generated: ${new Date().toLocaleString()}
`;

events.push(createEvent({

uid:
`${year}-${code}-${schedule.periodName.en.replaceAll(" ","-")}-${schedule.moed}-${en.replaceAll(" ","-")}@huji.local`,

summary:`בחינה ב- ${course.name} (${code})`,

start,
end,
location,
description

}));

}

}

log("✓ "+code);

}catch(e){

log("✗ "+code+" : "+e.message);

}

}

const ics=
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//HUJI Exam Calendar//EN
CALSCALE:GREGORIAN
${events.join("\n")}
END:VCALENDAR`;

const blob=new Blob([ics],{
type:"text/calendar"
});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download=`HUJI_Exams_${year}.ics`;

a.click();

URL.revokeObjectURL(a.href);

log("");
log("Done.");
log(events.length+" events generated.");

button.disabled=false;

};

</script>

</body>
</html>
